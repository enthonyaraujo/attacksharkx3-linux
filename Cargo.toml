[package]
name = "attack-shark-x3"
version = "1.0.0"
edition = "2021"
authors = ["Enthony <contact@example.com>"]
description = "Native Linux configuration driver and GUI for the Attack Shark X3 gaming mouse"
license = "MIT"
repository = "https://github.com/enthony/attacksharkx3-linux"
readme = "README.md"
keywords = ["attack-shark", "mouse", "hid", "driver", "linux"]
categories = ["hardware-support", "gui"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
] }
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-shared-hidraw"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
